# The full stack uses paid services. Review Render's cost estimate before creating.
services:
  - type: web
    name: shravya-codereview-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    preDeployCommand: alembic -c infra/migrations/alembic.ini upgrade head
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shravya-codereview-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: shravya-codereview-queue
          type: keyvalue
          property: connectionString
      - key: API_KEYS
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEFAULT_LLM_PROVIDER
        value: openai
      - key: WEBHOOK_DEFAULT_ORG_ID
        value: 00000000-0000-0000-0000-000000000001

  - type: worker
    name: shravya-codereview-worker
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    dockerCommand: python -m codereview_worker.main
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shravya-codereview-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: shravya-codereview-queue
          type: keyvalue
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: DEFAULT_LLM_PROVIDER
        value: openai

  - type: keyvalue
    name: shravya-codereview-queue
    plan: starter
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: shravya-codereview-db
    plan: basic-256mb
    region: singapore
    databaseName: codereview
    user: codereview
    ipAllowList: []
