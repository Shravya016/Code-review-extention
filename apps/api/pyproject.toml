[project]
name = "codereview-api"
version = "0.1.0"
description = "FastAPI code review API"
requires-python = ">=3.12"
dependencies = [
  "codereview-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "alembic>=1.14",
  "python-multipart>=0.0.17",
  "psycopg2-binary>=2.9",
  "pydantic-settings>=2.6",
]

[project.scripts]
codereview-api = "codereview_api.main:run"

[tool.uv.sources]
codereview-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
