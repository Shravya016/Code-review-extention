[project]
name = "codereview-common"
version = "0.1.0"
description = "Shared models, LLM adapters, RAG, and review pipelines"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "jinja2>=3.1",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "redis>=5.2",
  "PyJWT[crypto]>=2.10",
  "cryptography>=44.0",
  "pinecone>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
